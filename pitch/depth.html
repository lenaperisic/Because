<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Because · Depth and scale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /*
    Because · „Dubina ili obim“, 3 koraka uz govor. Isti stil kao ostali slajdovi.
    1: do sada: 10 intervjua (duboko, malo ljudi) ili 10.000 anketa (plitko, mnogo ljudi).
    2: sada: svaki korisnik, pravi intervju (narandžasta traka preko celog vrha).
    3: AI agent sam bira koga i šta da pita i upisuje odgovor nazad.
    Napred: →, Space, PageDown, Enter, klik. Nazad: ←, PageUp. 1–3: skok. ?beat=2, ?static=1 (za PNG).
  */
  :root {
    --font: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
    --deep: #10353c;
    --text: #f3f7f7;
    --soft: #a9c3c6;
    --muted: #8fb0b4;
    --line: rgba(243, 247, 247, 0.22);
    --voice: #e5572f;
    --ink: #13252a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #071a1e; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 50% 50%; background: var(--deep); color: var(--text); font-family: var(--font); cursor: pointer; }
  [data-in] { visibility: hidden; opacity: 0; }
  [data-in].shown { visibility: visible; opacity: 1; }

  h1 { position: absolute; left: 120px; top: 92px; margin: 0; font-size: 76px; font-weight: 900; letter-spacing: -0.035em; line-height: 1; }
  h1 em { font-style: normal; color: var(--voice); }

  /* grafik: x = koliko ljudi, y = koliko duboko */
  .plot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
  .plot .axis { fill: none; stroke: var(--soft); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .plot circle { transform-box: fill-box; transform-origin: center; }
  .plot .iv { fill: var(--text); }
  .plot .sv { fill: var(--text); opacity: 0.75; }
  .plot .bc { fill: var(--voice); }
  .ax-label { position: absolute; font-size: 30px; font-weight: 800; color: var(--soft); }
  .tick { position: absolute; top: 918px; width: 140px; margin-left: -70px; text-align: center; font-size: 26px; font-weight: 700; color: var(--muted); }
  .label { position: absolute; font-size: 46px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.05; white-space: nowrap; }
  .label.bc { color: var(--voice); text-align: right; }

  /* 3: šta agent radi sam */
  .agent { position: absolute; left: 1330px; top: 330px; width: 480px; }
  .agent small { display: block; margin-bottom: 26px; font-size: 30px; font-weight: 800; color: var(--soft); }
  .agent ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 28px; }
  .agent li { display: grid; grid-template-columns: 56px 1fr; gap: 20px; align-items: center; font-size: 42px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.1; }
  .agent li i { width: 56px; height: 56px; border-radius: 50%; background: var(--voice); display: grid; place-items: center; }
  .agent li svg { width: 30px; height: 30px; fill: none; stroke: #ffffff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }

  .progress { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; gap: 14px; opacity: 0.55; }
  .progress i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .progress i.on { background: var(--text); }
  .static .progress { display: none; }
</style>
</head>
<body>
<div id="stage" role="region" aria-label="Until now, depth or scale. Now, both.">
  <h1 data-in="1" data-out="2">Until now: depth <em>or</em> scale.</h1>
  <h1 data-in="2">Now: depth <em>and</em> scale.</h1>

  <svg class="plot" viewBox="0 0 1920 1080" aria-hidden="true">
    <g data-in="1"><path class="axis" id="axes" d="M220 250 V900 H1230 M204 272 L220 248 L236 272 M1208 884 L1232 900 L1208 916"/></g>
    <g id="ivs"></g>
    <g id="svs"></g>
    <g id="bcs"></g>
  </svg>
  <div class="ax-label" data-in="1" style="left:250px; top:232px">Depth</div>
  <div class="ax-label" data-in="1" style="right:690px; top:966px">Users reached</div>
  <div class="tick" data-in="1" style="left:300px">10</div>
  <div class="tick" data-in="1" style="left:520px">100</div>
  <div class="tick" data-in="1" style="left:740px">1,000</div>
  <div class="tick" data-in="1" style="left:960px">10,000</div>

  <div class="label" id="l-iv" style="left:240px; top:412px">10 interviews</div>
  <div class="label" id="l-sv" style="left:760px; top:752px">10,000 surveys</div>
  <div class="label bc" data-in="2" id="l-bc" style="right:700px; top:262px">Every user, a real interview</div>

  <section class="agent" data-in="3" aria-label="The AI agent">
    <small>The AI agent</small>
    <ul>
      <li><i><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17 19 7"/></svg></i>Picks who to ask</li>
      <li><i><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17 19 7"/></svg></i>Picks what to ask</li>
      <li><i><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17 19 7"/></svg></i>Writes it back</li>
    </ul>
  </section>

  <div class="progress" aria-hidden="true"><i></i><i></i><i></i></div>
</div>

<script>
(() => {
  const PREV = "how.html?beat=5", NEXT = "interview.html";
  const params = new URLSearchParams(location.search);
  const STATIC = params.get("static") === "1";
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const QUICK = STATIC || RM;
  const EASE = "cubic-bezier(0.22, 1, 0.36, 1)";
  const STEPS = 3;
  const stage = document.getElementById("stage");
  const $ = (id) => document.getElementById(id);
  if (STATIC) stage.classList.add("static");

  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  addEventListener("resize", fit);
  fit();

  // ---- tačke ----
  const NS = "http://www.w3.org/2000/svg";
  const dot = (g, cls, x, y, r) => { const c = document.createElementNS(NS, "circle"); c.setAttribute("class", cls); c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r); g.appendChild(c); return c; };
  // 10 intervjua: gusto, visoko, levo
  for (let i = 0; i < 10; i++) dot($("ivs"), "iv", 244 + (i % 5) * 28, 360 + Math.floor(i / 5) * 28, 11);
  // 10.000 anketa: sitno, nisko, desno (deterministički „nasumično“)
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 230; i++) dot($("svs"), "sv", 760 + rnd() * 420, 828 + rnd() * 52, 4.5);
  // Because: duboko, preko cele širine
  for (let x = 400; x <= 1204; x += 28) for (let r = 0; r < 3; r++) dot($("bcs"), "bc", x, 332 + r * 28, 11);
  const ivs = () => [...$("ivs").children], svs = () => [...$("svs").children], bcs = () => [...$("bcs").children];

  // ---- motor koraka ----
  const anims = [], timers = [];
  const A = (el, kf, opt) => { const a = el.animate(kf, { fill: "both", easing: EASE, ...opt, duration: QUICK ? 1 : opt.duration, delay: QUICK ? 0 : opt.delay || 0 }); anims.push(a); return a; };
  const rise = (el, delay = 0, dur = 650) => A(el, [{ opacity: 0, transform: "translateY(24px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: dur, delay });
  const pop = (el, delay, dur = 320) => A(el, [{ opacity: 0, transform: "scale(0.2)" }, { opacity: 1, transform: "scale(1)" }], { duration: dur, delay });
  const stopAll = () => { anims.splice(0).forEach((a) => a.cancel()); timers.splice(0).forEach(clearTimeout); };
  const vis = (els, on) => els.forEach((e) => { e.style.opacity = on ? "" : "0"; });

  const axes = $("axes");
  const axLen = axes.getTotalLength();
  axes.style.strokeDasharray = `${axLen}`;

  const hooks = {
    1: {
      reset() { vis([...ivs(), ...svs(), $("l-iv"), $("l-sv")], false); axes.style.strokeDashoffset = `${axLen}`; },
      final() { vis([...ivs(), ...svs(), $("l-iv"), $("l-sv")], true); axes.style.strokeDashoffset = "0"; },
      enter() {
        this.final();
        A(axes, [{ strokeDashoffset: axLen }, { strokeDashoffset: 0 }], { duration: 900, easing: "cubic-bezier(0.65, 0, 0.35, 1)" });
        ivs().forEach((c, i) => pop(c, 700 + i * 50, 380));
        rise($("l-iv"), 1100);
        svs().forEach((c, i) => pop(c, 1700 + i * 5, 260));
        rise($("l-sv"), 2300);
      },
    },
    2: {
      reset() { vis(bcs(), false); },
      final() { vis(bcs(), true); },
      enter() {
        this.final();
        // Traka se širi s leva na desno, od intervjua ka svima.
        bcs().forEach((c) => pop(c, 250 + (Number(c.getAttribute("cx")) - 400) * 1.4, 340));
      },
    },
    3: {
      reset() {},
      final() {},
      enter() { document.querySelectorAll(".agent li").forEach((li, i) => rise(li, 350 + i * 450, 560)); },
    },
  };

  const els = [...document.querySelectorAll("[data-in]")];
  const nav = [...document.querySelectorAll(".progress i")];
  let cur = 0;
  function go(n) {
    if (n < 1) { location.href = PREV; return; }
    if (n > STEPS) { if (NEXT) location.href = NEXT; return; }
    if (n === cur) return;
    stopAll();
    const forward = n > cur;
    for (const el of els) {
      const a = Number(el.dataset.in), b = el.dataset.out ? Number(el.dataset.out) : Infinity;
      const v = a <= n && n < b;
      el.classList.toggle("shown", v);
      if (v && a === n && forward && !QUICK && el.tagName !== "g") rise(el, Number(el.dataset.delay || 0));
    }
    for (let k = 1; k <= STEPS; k++) {
      const h = hooks[k];
      if (k < n || (k === n && (!forward || QUICK))) h.final();
      else if (k === n) h.enter();
      else h.reset();
    }
    cur = n;
    nav.forEach((el, i) => el.classList.toggle("on", i === n - 1));
  }

  addEventListener("keydown", (e) => {
    const k = e.key;
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(k)) { e.preventDefault(); go(cur + 1); }
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); go(cur - 1); }
    else if (k === "Home") { cur = 0; go(1); }
    else if (/^[1-3]$/.test(k)) go(Number(k));
  });
  stage.addEventListener("click", () => go(cur + 1));
  go(Math.max(1, Math.min(STEPS, Number(params.get("beat")) || 1)));
})();
</script>
</body>
</html>
