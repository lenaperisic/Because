<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Because · Today's two options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /*
    Because · „Danas timovi imaju dve opcije“, 2 koraka uz govor (1: anketa i intervjui zajedno, 2: oni koji su odustali). Isti stil kao uvod.
    Napred: →, Space, PageDown, Enter, klik. Nazad: ←, PageUp. 1–2: skok. ?beat=2, ?static=1 (za PNG).
    Sa prvog koraka ← vodi na uvod (korak 4), posle poslednjeg → na „Kako radi“.
  */
  :root {
    --font: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
    --deep: #10353c;
    --text: #f3f7f7;
    --soft: #a9c3c6;
    --muted: #8fb0b4;
    --line: rgba(243, 247, 247, 0.22);
    --panel: rgba(243, 247, 247, 0.05);
    --voice: #e5572f;
    --ink: #13252a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #071a1e; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 50% 50%; background: var(--deep); color: var(--text); font-family: var(--font); cursor: pointer; }
  [data-in] { visibility: hidden; opacity: 0; }
  [data-in].shown { visibility: visible; opacity: 1; }

  h1 { position: absolute; left: 120px; top: 92px; margin: 0; font-size: 76px; font-weight: 900; letter-spacing: -0.035em; line-height: 1; }
  .card { position: absolute; top: 236px; width: 800px; height: 724px; border-radius: 30px; background: var(--panel); border: 2px solid var(--line); padding: 44px 44px 40px; transition: opacity 500ms cubic-bezier(0.22, 1, 0.36, 1); }
  #stage .card.dim { opacity: 0.32; }
  #cardA { left: 120px; }
  #cardB { left: 1000px; }
  .card h2 { margin: 0; font-size: 50px; font-weight: 900; letter-spacing: -0.03em; }
  .card .sub { margin: 8px 0 0; font-size: 28px; font-weight: 600; color: var(--soft); }

  /* A: anketa */
  .widget { margin-top: 26px; background: #ffffff; color: var(--ink); border-radius: 20px; padding: 20px 26px 22px; }
  .widget .q { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; }
  .scale { display: flex; gap: 10px; margin-top: 14px; }
  .scale i { width: 48px; height: 48px; border-radius: 50%; border: 3px solid #c9d6d6; display: grid; place-items: center; font-style: normal; font-size: 21px; font-weight: 800; color: var(--ink); transition: background 200ms, color 200ms, border-color 200ms; }
  .scale i.pick { background: var(--ink); border-color: var(--ink); color: #ffffff; }

  /* Dve različite osobe (kosa, majica), isto lice i ista rečenica, a drugačiji broj na tablici. */
  .duo { position: absolute; left: 0; right: 0; top: 330px; height: 300px; }
  .p { position: absolute; top: 0; width: 360px; height: 300px; }
  .p.a { left: 30px; } .p.b { left: 410px; }
  .p .say { position: absolute; left: 25px; top: 0; width: 310px; white-space: nowrap; padding: 13px 16px; border-radius: 22px; background: #ffffff; color: var(--ink); font-size: 27px; font-weight: 800; line-height: 1.15; text-align: center; }
  .p .say::after { content: ""; position: absolute; left: 50%; bottom: -11px; width: 24px; height: 24px; margin-left: -12px; background: #ffffff; transform: rotate(45deg); }
  .p .body { position: absolute; left: 95px; top: 186px; width: 170px; height: 114px; border-radius: 85px 85px 0 0; background: var(--shirt); }
  .p .bun { position: absolute; left: 200px; top: 70px; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); }
  .p .head { position: absolute; left: 125px; top: 82px; width: 110px; height: 110px; border-radius: 50%; background: #ffffff; border: 5px solid var(--ink); }
  .p .hair { position: absolute; left: 125px; top: 82px; width: 110px; height: 110px; border-radius: 50%; background: var(--ink); clip-path: inset(0 0 60% 0); }
  .p .eye { position: absolute; top: 126px; width: 11px; height: 11px; border-radius: 50%; background: var(--ink); }
  .p .eye.l { left: 157px; } .p .eye.r { left: 192px; }
  .p .mouth { position: absolute; left: 162px; top: 158px; width: 36px; height: 5px; border-radius: 3px; background: var(--ink); }
  .p .score { position: absolute; left: 0; top: 0; width: 360px; height: 300px; }
  .p .paddle { position: absolute; left: 135px; top: 198px; width: 90px; height: 90px; border-radius: 14px; background: #ffffff; color: var(--ink); box-shadow: 0 0 0 5px var(--ink); display: grid; place-items: center; font-size: 56px; font-weight: 900; }
  .p .hand { position: absolute; top: 266px; width: 28px; height: 28px; border-radius: 50%; background: #ffffff; border: 4px solid var(--ink); }
  .p .hand.l { left: 121px; } .p .hand.r { left: 211px; }
  .verdict { position: absolute; left: 44px; bottom: 26px; font-size: 32px; font-weight: 800; color: var(--soft); }
  .verdict b { color: var(--text); }

  /* B: intervjui */
  .days-label { margin-top: 34px; font-size: 26px; font-weight: 700; color: var(--muted); display: flex; justify-content: space-between; }
  .days { display: flex; gap: 6px; margin-top: 12px; }
  .days i { width: 18px; height: 40px; border-radius: 5px; border: 2px solid var(--line); }
  .days i.on { background: var(--soft); border-color: var(--soft); }
  .crowd { display: grid; grid-template-columns: repeat(20, 16px); gap: 10px; margin-top: 40px; }
  .crowd i { width: 16px; height: 16px; border-radius: 50%; background: rgba(243, 247, 247, 0.18); transition: background 300ms, opacity 600ms; }
  .crowd i.vol { background: #ffffff; box-shadow: 0 0 0 5px rgba(243, 247, 247, 0.16); }
  .crowd i.gone { background: transparent; border: 2px dashed var(--voice); opacity: 0.85; }
  .legend { position: absolute; left: 44px; bottom: 40px; display: grid; gap: 12px; font-size: 28px; font-weight: 700; }
  .legend span::before { content: ""; display: inline-block; width: 16px; height: 16px; margin-right: 12px; border-radius: 50%; vertical-align: 1px; }
  .legend .v::before { background: #ffffff; }
  .legend .g { color: var(--voice); }
  .legend .g::before { border: 2px dashed var(--voice); }

  .progress { position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); display: flex; gap: 14px; opacity: 0.55; }
  .progress i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .progress i.on { background: var(--text); }
  .static .progress { display: none; }
</style>
</head>
<body>
<div id="stage" role="region" aria-label="Today, teams have two options">
  <h1 data-in="1">Today, teams have two options.</h1>

  <section class="card" id="cardA" data-in="1" aria-label="Survey">
    <h2>Survey</h2>
    <div class="widget">
      <div class="q">How satisfied are you with AI summary?</div>
      <div class="scale" id="scale"></div>
    </div>
    <div class="duo" aria-label="Two different users say the same thing, but score 7 and 4">
      <div class="p a" id="pa" style="--shirt:#6b8a92">
        <div class="say" id="sa">“It's fine, I guess.”</div>
        <div class="body"></div>
        <div class="head"></div><div class="hair"></div>
        <i class="eye l"></i><i class="eye r"></i><i class="mouth"></i>
        <div class="score" id="ka"><div class="paddle">7</div><i class="hand l"></i><i class="hand r"></i></div>
      </div>
      <div class="p b" id="pb" style="--shirt:#a5774f">
        <div class="say" id="sb">“It's fine, I guess.”</div>
        <div class="body"></div>
        <i class="bun"></i><div class="head"></div><div class="hair"></div>
        <i class="eye l"></i><i class="eye r"></i><i class="mouth"></i>
        <div class="score" id="kb"><div class="paddle">4</div><i class="hand l"></i><i class="hand r"></i></div>
      </div>
    </div>
    <div class="verdict" id="verdict">Same feeling. <b>Different number.</b></div>
  </section>

  <section class="card" id="cardB" data-in="1" aria-label="User interviews">
    <h2>User interviews</h2>
    <div class="days-label"><span>Week 1</span><span>Week 2</span><span>Week 3</span><span>Week 4</span></div>
    <div class="days" id="days"></div>
    <div class="crowd" id="crowd" aria-hidden="true"></div>
    <div class="legend">
      <span class="v" id="lv">Volunteered: 10 of 200 users</span>
      <span class="g" id="lg">Quietly gave up: 21, and none volunteered</span>
    </div>
  </section>

  <div class="progress" aria-hidden="true"><i></i><i></i></div>
</div>

<script>
(() => {
  const PREV = "intro.html?beat=4", NEXT = "how.html";
  const params = new URLSearchParams(location.search);
  const STATIC = params.get("static") === "1";
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const QUICK = STATIC || RM;
  const EASE = "cubic-bezier(0.22, 1, 0.36, 1)";
  const STEPS = 2;
  const stage = document.getElementById("stage");
  const $ = (id) => document.getElementById(id);
  if (STATIC) stage.classList.add("static");

  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  addEventListener("resize", fit);
  fit();

  // ---- sadržaj ----
  for (let i = 1; i <= 10; i++) { const el = document.createElement("i"); el.textContent = i; $("scale").appendChild(el); }
  for (let i = 0; i < 30; i++) $("days").appendChild(document.createElement("i"));
  for (let i = 0; i < 200; i++) $("crowd").appendChild(document.createElement("i"));
  // Odustali su desno (da „odu“ ka ivici); dobrovoljci su među ostalima.
  const GONE = [16, 18, 37, 39, 55, 57, 58, 76, 79, 96, 97, 115, 118, 119, 136, 138, 156, 157, 175, 178, 197];
  const VOL = [21, 44, 63, 82, 105, 108, 127, 144, 161, 183];

  // ---- motor koraka ----
  const anims = [], timers = [];
  const A = (el, kf, opt) => { const a = el.animate(kf, { fill: "both", easing: EASE, ...opt, duration: QUICK ? 1 : opt.duration, delay: QUICK ? 0 : opt.delay || 0 }); anims.push(a); return a; };
  const rise = (el, delay = 0, dur = 650) => A(el, [{ opacity: 0, transform: "translateY(24px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: dur, delay });
  const later = (ms, fn) => { if (QUICK) fn(); else timers.push(setTimeout(fn, ms)); };
  const stopAll = () => { anims.splice(0).forEach((a) => a.cancel()); timers.splice(0).forEach(clearTimeout); };

  const scale = () => [...$("scale").children];
  const crowd = () => [...$("crowd").children];
  // Pojedinačne animacije: 1 anketa, 2 intervjui, 3 odustali.
  const parts = {
    1: {
      parts: ["pa", "pb", "sa", "sb", "ka", "kb", "verdict"],
      reset() { scale().forEach((p) => p.classList.remove("pick")); this.parts.forEach((id) => { $(id).style.opacity = "0"; }); },
      final() { this.reset(); scale()[6].classList.add("pick"); scale()[3].classList.add("pick"); this.parts.forEach((id) => { $(id).style.opacity = "1"; }); },
      enter() {
        this.reset();
        const pop = (id) => { $(id).style.opacity = ""; A($(id), [{ opacity: 0, transform: "scale(0.7) translateY(14px)" }, { opacity: 1, transform: "none" }], { duration: 420 }); };
        const raise = (id) => { $(id).style.opacity = ""; A($(id), [{ opacity: 0, transform: "translateY(34px) rotate(-8deg)" }, { opacity: 1, transform: "none" }], { duration: 520 }); };
        scale().forEach((p, i) => A(p, [{ opacity: 0, transform: "scale(0.5)" }, { opacity: 1, transform: "scale(1)" }], { duration: 320, delay: 500 + i * 40 }));
        // Dve osobe, ista rečenica...
        later(700, () => { $("pa").style.opacity = ""; rise($("pa")); });
        later(850, () => { $("pb").style.opacity = ""; rise($("pb")); });
        later(1500, () => pop("sa"));
        later(2000, () => pop("sb"));
        // ...pa različit broj na tablici.
        later(2800, () => { raise("ka"); scale()[6].classList.add("pick"); });
        later(3400, () => { raise("kb"); scale()[3].classList.add("pick"); });
        later(4100, () => { $("verdict").style.opacity = ""; rise($("verdict")); });
      },
    },
    2: {
      reset() { [...$("days").children].forEach((d) => d.classList.remove("on")); crowd().forEach((c) => c.classList.remove("vol")); $("lv").style.opacity = "0"; },
      final() { this.reset(); [...$("days").children].forEach((d) => d.classList.add("on")); VOL.forEach((i) => crowd()[i].classList.add("vol")); $("lv").style.opacity = "1"; },
      enter() {
        this.reset();
        [...$("days").children].forEach((d, i) => later(500 + i * 45, () => d.classList.add("on")));
        crowd().forEach((c, i) => A(c, [{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 700 + (i % 20) * 18 + Math.floor(i / 20) * 12 }));
        VOL.forEach((idx, k) => later(2100 + k * 110, () => {
          crowd()[idx].classList.add("vol");
          if (!QUICK) crowd()[idx].animate([{ transform: "scale(1.8)" }, { transform: "scale(1)" }], { duration: 420, easing: EASE });
        }));
        later(3300, () => { $("lv").style.opacity = ""; rise($("lv")); });
      },
    },
    3: {
      reset() { $("cardA").classList.remove("dim"); crowd().forEach((c) => { c.classList.remove("gone"); c.style.transform = ""; c.style.opacity = ""; }); $("lg").style.opacity = "0"; },
      final() { this.reset(); $("cardA").classList.add("dim"); GONE.forEach((i) => { crowd()[i].classList.add("gone"); crowd()[i].style.transform = "translateX(34px)"; crowd()[i].style.opacity = "0.55"; }); $("lg").style.opacity = "1"; },
      enter() {
        this.reset();
        $("cardA").classList.add("dim");
        GONE.forEach((idx, k) => later(300 + k * 60, () => {
          const c = crowd()[idx];
          c.classList.add("gone");
          A(c, [{ transform: "translateX(0)", opacity: 0.85 }, { transform: "translateX(34px)", opacity: 0.55 }], { duration: 1100 });
        }));
        later(1900, () => { $("lg").style.opacity = ""; rise($("lg")); });
      },
    },
  };
  const S = parts[1], I = parts[2], G = parts[3];
  // Korak 1: anketa i intervjui odjednom. Korak 2: odustali.
  const hooks = {
    1: {
      reset() { S.reset(); I.reset(); },
      final() { S.final(); I.final(); },
      enter() { S.enter(); I.enter(); },
    },
    2: G,
  };

  const els = [...document.querySelectorAll("[data-in]")];
  const nav = [...document.querySelectorAll(".progress i")];
  let cur = 0;
  function go(n) {
    if (n < 1) { location.href = PREV; return; }
    if (n > STEPS) { location.href = NEXT; return; }
    if (n === cur) return;
    stopAll();
    const forward = n > cur;
    for (const el of els) {
      const vis = Number(el.dataset.in) <= n;
      el.classList.toggle("shown", vis);
      if (vis && Number(el.dataset.in) === n && forward && !QUICK) rise(el, Number(el.dataset.delay || 0));
    }
    for (let k = 1; k <= STEPS; k++) {
      const h = hooks[k];
      if (k < n || (k === n && (!forward || QUICK))) h.final();
      else if (k === n) h.enter();
      else h.reset();
    }
    cur = n;
    nav.forEach((el, i) => el.classList.toggle("on", i === n - 1));
  }

  addEventListener("keydown", (e) => {
    const k = e.key;
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(k)) { e.preventDefault(); go(cur + 1); }
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); go(cur - 1); }
    else if (k === "Home") { cur = 0; go(1); }
    else if (/^[1-2]$/.test(k)) go(Number(k));
  });
  stage.addEventListener("click", () => go(cur + 1));
  go(Math.max(1, Math.min(STEPS, Number(params.get("beat")) || 1)));
})();
</script>
</body>
</html>
