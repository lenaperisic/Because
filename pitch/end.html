<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Because · Thank you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /*
    Because · kraj, 2 koraka uz govor.
    1: „Analytics tell you what. Because tells you why.“ (odjek poslednjeg koraka uvoda).
    2: „Thank you“ u istom rasporedu kao naslovna kartica (logo, tim, imena, hakaton).
    Napred: →, Space, PageDown, Enter, klik. Nazad: ←, PageUp. 1–2: skok. ?beat=2, ?static=1 (za PNG).
  */
  :root {
    --font: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
    --deep: #10353c;
    --text: #f3f7f7;
    --soft: #a9c3c6;
    --muted: #8fb0b4;
    --line: rgba(243, 247, 247, 0.22);
    --voice: #e5572f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #071a1e; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 50% 50%; background: var(--deep); color: var(--text); font-family: var(--font); cursor: pointer; }
  [data-in] { visibility: hidden; opacity: 0; }
  [data-in].shown { visibility: visible; opacity: 1; }

  /* 1: završna rečenica */
  .lines { position: absolute; left: 0; right: 0; top: 400px; text-align: center; }
  .line { font-size: 120px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.12; }
  .line.l1 { color: var(--soft); }
  .line .why { color: var(--voice); }
  .line svg { display: inline-block; width: 92px; height: 92px; margin-left: 22px; vertical-align: -6px; fill: var(--voice); }

  /* 2: hvala (isti raspored kao naslovna kartica) */
  .lockup { position: absolute; left: 50%; top: 440px; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 40px; }
  .lockup svg { width: 170px; height: 170px; fill: var(--voice); }
  .lockup b { font-size: 190px; font-weight: 900; letter-spacing: -0.045em; line-height: 1; }
  .thanks { position: absolute; left: 0; right: 0; top: 610px; margin: 0; text-align: center; font-size: 84px; font-weight: 900; letter-spacing: -0.035em; }
  .team { position: absolute; left: 96px; bottom: 86px; }
  .team span { display: block; margin-bottom: 6px; font-size: 26px; font-weight: 700; color: var(--muted); }
  .team strong { font-size: 56px; font-weight: 900; letter-spacing: -0.03em; }
  .members { position: absolute; right: 96px; bottom: 90px; margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: auto auto; gap: 12px 60px; text-align: right; font-size: 32px; font-weight: 700; color: #d5e3e4; }
  .event { position: absolute; right: 96px; top: 78px; font-size: 26px; font-weight: 700; color: var(--muted); }

  .progress { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; gap: 14px; opacity: 0.55; }
  .progress i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .progress i.on { background: var(--text); }
  .static .progress { display: none; }
</style>
</head>
<body>
<div id="stage" role="region" aria-label="Analytics tell you what. Because tells you why. Thank you.">
  <div class="lines" data-in="1" data-out="2">
    <div class="line l1" id="l1">Analytics tell you what.</div>
    <div class="line l2" id="l2">Because tells you <span class="why">why</span>.<svg viewBox="0 0 24 24" id="mark" aria-hidden="true"><circle cx="5.5" cy="7" r="3.1"/><circle cx="18.5" cy="7" r="3.1"/><circle cx="12" cy="18" r="3.1"/></svg></div>
  </div>

  <div class="lockup" data-in="2" id="lockup">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="7" r="3.1"/><circle cx="18.5" cy="7" r="3.1"/><circle cx="12" cy="18" r="3.1"/></svg>
    <b>because</b>
  </div>
  <p class="thanks" data-in="2" data-delay="350">Thank you.</p>
  <div class="team" data-in="2" data-delay="700"><span>Team</span><strong>Chunk Loader</strong></div>
  <ul class="members" data-in="2" data-delay="800" aria-label="Team members">
    <li>Milica Gojak</li><li>Lena Perišić</li><li>Ljubica Mihailović</li><li>Andrej Čolić</li>
  </ul>
  <div class="event" data-in="2" data-delay="900">Garaža Frontier Hackathon 2026</div>

  <div class="progress" aria-hidden="true"><i></i><i></i></div>
</div>

<script>
(() => {
  const PREV = "future.html?beat=3", NEXT = "";
  const params = new URLSearchParams(location.search);
  const STATIC = params.get("static") === "1";
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const QUICK = STATIC || RM;
  const EASE = "cubic-bezier(0.22, 1, 0.36, 1)";
  const STEPS = 2;
  const stage = document.getElementById("stage");
  const $ = (id) => document.getElementById(id);
  if (STATIC) stage.classList.add("static");

  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  addEventListener("resize", fit);
  fit();

  // ---- motor koraka ----
  const anims = [];
  const A = (el, kf, opt) => { const a = el.animate(kf, { fill: "both", easing: EASE, ...opt, duration: QUICK ? 1 : opt.duration, delay: QUICK ? 0 : opt.delay || 0 }); anims.push(a); return a; };
  const rise = (el, delay = 0, dur = 650) => A(el, [{ opacity: 0, transform: "translateY(24px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: dur, delay });
  const stopAll = () => { anims.splice(0).forEach((a) => a.cancel()); };

  const hooks = {
    1: {
      reset() {},
      final() {},
      enter() {
        rise($("l1"), 0, 700);
        rise($("l2"), 1100, 700);
        A($("mark"), [{ opacity: 0, transform: "translateX(-14px)" }, { opacity: 1, transform: "none" }], { duration: 700, delay: 1900 });
      },
    },
    2: {
      reset() {},
      final() {},
      enter() { A($("lockup"), [{ opacity: 0, transform: "translate(-50%, -50%) scale(0.94)" }, { opacity: 1, transform: "translate(-50%, -50%) scale(1)" }], { duration: 800 }); },
    },
  };

  const els = [...document.querySelectorAll("[data-in]")];
  const nav = [...document.querySelectorAll(".progress i")];
  let cur = 0;
  function go(n) {
    if (n < 1) { location.href = PREV; return; }
    if (n > STEPS) { if (NEXT) location.href = NEXT; return; }
    if (n === cur) return;
    stopAll();
    const forward = n > cur;
    for (const el of els) {
      const a = Number(el.dataset.in), b = el.dataset.out ? Number(el.dataset.out) : Infinity;
      const v = a <= n && n < b;
      el.classList.toggle("shown", v);
      if (v && a === n && forward && !QUICK && el.id !== "lockup") rise(el, Number(el.dataset.delay || 0));
    }
    for (let k = 1; k <= STEPS; k++) {
      const h = hooks[k];
      if (k < n || (k === n && (!forward || QUICK))) h.final();
      else if (k === n) h.enter();
      else h.reset();
    }
    cur = n;
    nav.forEach((el, i) => el.classList.toggle("on", i === n - 1));
  }

  addEventListener("keydown", (e) => {
    const k = e.key;
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(k)) { e.preventDefault(); go(cur + 1); }
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); go(cur - 1); }
    else if (k === "Home") { cur = 0; go(1); }
    else if (/^[1-2]$/.test(k)) go(Number(k));
  });
  stage.addEventListener("click", () => go(cur + 1));
  go(Math.max(1, Math.min(STEPS, Number(params.get("beat")) || 1)));
})();
</script>
</body>
</html>
